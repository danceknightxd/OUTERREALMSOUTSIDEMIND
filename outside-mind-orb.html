<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Outside Mind</title>
<style>
body {
  margin: 0;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}
.orb-wrap {
  position: relative;
  width: 120px;
  height: 120px;
  cursor: pointer;
  text-decoration: none;
}
.orb {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  overflow: hidden;
  background: #0a0a0a;
  box-shadow: 0 0 22px rgba(255, 107, 26, 0.75),
              0 0 50px rgba(255, 61, 0, 0.4),
              inset 0 0 24px rgba(0,0,0,0.6);
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.orb video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 50%;
}
.fire-ring {
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 3;
  background: conic-gradient(
    from 0deg,
    transparent 0deg,
    #ff6b1a 40deg,
    #ff3d00 80deg,
    #ffaa00 120deg,
    transparent 160deg,
    transparent 200deg,
    #ff6b1a 240deg,
    #ff3d00 280deg,
    transparent 320deg,
    transparent 360deg
  );
  mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 5px));
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 5px));
  animation: fireSpin 4s linear infinite;
  opacity: 0.9;
  filter: blur(0.5px);
}
@keyframes fireSpin {
  to { transform: rotate(360deg); }
}
.orb-wrap:hover .orb {
  transform: scale(1.15);
}
</style>
</head>
<body>
<a class="orb-wrap" href="https://danceknightprime.blogspot.com/p/the-outside-mind.html" target="_blank" rel="noopener">
  <div class="fire-ring"></div>
  <div class="orb">
    <video autoplay loop muted playsinline preload="metadata"
           src="https://cdn.jsdelivr.net/gh/danceknightxd/OUTERREALMSOUTSIDEMIND@main/generated_video_clean.mp4"></video>
  </div>
</a>
<script>
document.querySelector('video').play().catch(function(){});
</script>
</body>
</html>
